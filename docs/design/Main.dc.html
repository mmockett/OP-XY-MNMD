<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MD MNM Screen and Controls</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
button{font-family:inherit}
.dial{appearance:none;background:none;border:0;padding:0;margin:0;cursor:ns-resize;touch-action:none;border-radius:50%;display:block}
.dial:focus-visible,.key:focus-visible{outline:2px solid #fff;outline-offset:3px}
.key{appearance:none;background:#161615;border:1px solid #5f5f5a;border-radius:8px;color:#a8a8a0;cursor:pointer;font-size:11px;padding:0;height:40px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.key:hover{border-color:#a8a8a0;color:#e8e8e0}
.key.lit{border-color:#f4f4ec;color:#fff}
.key.act{background:#d9d9d1;border-color:#d9d9d1;color:#111}
.key.now{border-color:#fff;box-shadow:0 0 0 2px #121211,0 0 0 4px #fff}
.key.act.now{background:#fff}
.key:disabled{opacity:.35;cursor:default}
</style>
</helmet>
<div style="position:relative;width:520px;height:548px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;gap:14px;background:#070707;font-family:Roboto,system-ui,sans-serif;color:#e8e8e0;overflow:hidden">

<div style="position:relative;width:480px;height:222px;flex:none;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #2a2a28">

<div style="position:absolute;left:0;top:0;width:480px;height:28px;display:grid;grid-template-columns:repeat(8,60px)">
<sc-for list="{{cells}}" as="h" hint-placeholder-count="8">
<div style="box-sizing:border-box;height:28px;overflow:hidden;background:{{h.bg}};color:{{h.fg}};opacity:{{h.op}};padding:{{h.pad}};font-size:{{h.fs}};font-weight:300;line-height:{{h.lh}};font-variant-numeric:tabular-nums;white-space:nowrap">{{h.text}}</div>
</sc-for>
</div>

<div role="img" aria-label="{{viewLabel}}" style="position:absolute;left:0;top:30px;width:480px;height:160px">
<sc-for list="{{layers}}" as="ly" hint-placeholder-count="10">
<svg viewBox="0 0 480 160" aria-hidden="true" style="position:absolute;left:0;top:0;width:480px;height:160px;overflow:visible"><path d="{{ly.d}}" fill="{{ly.fill}}" stroke="{{ly.stroke}}" stroke-width="{{ly.sw}}" stroke-dasharray="{{ly.dash}}" stroke-linejoin="round" stroke-linecap="round"></path></svg>
</sc-for>
<sc-for list="{{labels}}" as="lb" hint-placeholder-count="4">
<span style="position:absolute;color:#8c8d92;white-space:nowrap;left:{{lb.x}};top:{{lb.y}};width:{{lb.w}};text-align:{{lb.al}};font-size:{{lb.fs}};line-height:{{lb.lh}}">{{lb.t}}</span>
</sc-for>
</div>

<div style="position:absolute;left:10px;top:194px;width:460px;display:flex;justify-content:space-between;font-size:10px;color:#a8a8a0"><span>{{where}} &middot; {{engName}}</span><span>{{setName}} &middot; {{bpm}} bpm</span></div>

<div style="position:absolute;left:10px;top:211px;width:460px;display:flex;gap:5px">
<sc-for list="{{pips}}" as="p" hint-placeholder-count="16">
<span style="display:block;width:24px;height:4px;background:{{p.bg}}"></span>
</sc-for>
</div>
</div>

<div style="width:480px;flex:none;box-sizing:border-box;padding:14px;background:#121211;border:1px solid #2a2a28;border-radius:16px;display:flex;flex-direction:column;gap:8px">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:72px;margin-bottom:4px">
<sc-for list="{{dials}}" as="d" hint-placeholder-count="4">
<div style="display:flex;justify-content:center;align-items:center">
<button class="dial" aria-label="{{d.aria}}" onPointerDown="{{d.down}}" onPointerMove="{{d.move}}" onPointerUp="{{d.up}}" onPointerCancel="{{d.up}}" onWheel="{{d.wheel}}" onKeyDown="{{d.key}}" onClick="{{d.click}}">
<svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true">
<circle cx="32" cy="32" r="30" fill="#181817" stroke="#55554f" stroke-width="1.5"></circle>
<circle cx="32" cy="32" r="24" fill="none" stroke="#3a3a37" stroke-width="3" stroke-dasharray="1.2 2.4"></circle>
<circle cx="32" cy="32" r="17" fill="{{d.cap}}" stroke="#6a6a64" stroke-width="1"></circle>
<g transform="{{d.rot}}"><line x1="32" y1="9" x2="32" y2="19" stroke="#f4f4ec" stroke-width="3" stroke-linecap="round"></line></g>
</svg>
</button>
</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{fkeys}}" as="f" hint-placeholder-count="3">
<button class="{{f.cls}}" aria-label="{{f.aria}}" aria-pressed="{{f.pressed}}" onClick="{{f.press}}">{{f.label}}</button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px">
<sc-for list="{{skeys}}" as="s" hint-placeholder-count="16">
<button class="{{s.cls}}" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" disabled="{{s.off}}" onClick="{{s.press}}">{{s.label}}</button>
</sc-for>
</div>

<div style="margin-top:2px;font-size:10px;color:#8f8f88;text-align:center">click: engine &middot; shift: set B &middot; shift + click: md / mnm &middot; shift + key: track</div>
</div>
</div>
</x-dc>

function glyph(name,v){
  const W=104,B=54,res={line:'',fill:'',nx:-20,ny:-20};
  const k=KIND[name.toUpperCase()]||'bar', nm=name.toUpperCase();

  const lp=(xc,bump,mirror)=>{
    let pts=[[0,16],[xc-10,16],[xc-2,16-bump],[xc+6,28],[Math.min(W,xc+20),52],[W,54]];
    if(mirror)pts=pts.map(p=>[W-p[0],p[1]]).reverse();

  else if(k==='dec'){const len=14+v*86;const pts=sample(x=>dec(len,x),0,len,40);res.line=poly(pts);node(pts[pts.length-1]);}

  else if(k==='dist'){const A=22*(1+v*2.2);const pts=sample(x=>29-Math.max(-22,Math.min(22,A*Math.sin(2*Math.PI*2*x/W))),0,W,120);res.line=poly(pts);}
  else if(k==='lp'||k==='hp'||k==='peak'){

    if(k==='peak'){xc=60;bump=4+v*30;}

  const hard=v.P('HARD',0.5),rich=v.P('RICH',0.4),tone=v.P(['TONE','PTCH'],0.5),cy=84;
  const r0=(18+tone*8),sp=Math.min(200/Math.max(1,n-1),r0*1.4+rate*24),x0=118-sp*(n-1)/2;
  b.add('faint#tl',LN(10,cy+r0+16,226,cy+r0+16));

    const x=x0+i*sp,r=r0*(1-i*0.09),on=v.ph>0&&Math.floor(v.ph*n)===i;
    const k=8;let d='';

function grainSim(n,seed,T,live,ax,ay){
  const out=[];
  for(let i=0;i<n;i++){
    let x=(RND(i+seed)*2-1)*0.62,y=0.28+RND(i+seed+50)*0.44;
    if(live){
      const env=Math.exp(-T*2.6),w1=11+RND(i+seed+100)*13,w2=6+RND(i+seed+150)*8,p1=RND(i+seed+200)*6.283,a=0.55+RND(i+seed+250)*0.7;
      y-=Math.abs(Math.sin(w1*T+p1))*a*ay*env;x+=Math.sin(w2*T+p1*1.7)*ax*a*env;
    }
    const r=Math.hypot(x,y);if(r>0.8){x*=0.8/r;y*=0.8/r;}
    out.push([x,y]);
  }
  return out;
}

function pathPolys(d){

      if(tonal){
        const f=tonal[0]*Math.pow(2,p*tonal[1]);
        D=tonal[2]+dec*tonal[3];
        const o=c.createOscillator(); o.type=tonal[4];
        const top=f*(1+bend*(cls==='kick'?6:3));
        o.frequency.setValueAtTime(top,now); o.frequency.exponentialRampToValueAtTime(f,now+0.01+rdec*0.2);
        const og=c.createGain(); og.gain.value=0.6; o.connect(og); og.connect(src); stops.push(o);
        if(cls==='bell')osc('square',f*1.504,0.3);
        if(fam==='EFM'&&mod>0.01){
          const mo=c.createOscillator(); mo.type='sine'; mo.frequency.value=f*Math.pow(2,mfrq*4-1);
          const mg=c.createGain(); mg.gain.setValueAtTime(mod*f*6,now); mg.gain.exponentialRampToValueAtTime(Math.max(1,mod*f*0.3),now+0.02+mdec*0.6);
          mo.connect(mg); mg.connect(o.frequency); stops.push(mo);
        }
        const nz=nzP<0?(cls==='snare'?0.5:0):nzP*(cls==='snare'?1:0.5);
        if(nz>0.02||click>0.02){
          const ng=noise(0,src);
          ng.gain.setValueAtTime(nz*0.8+click*0.9,now);
          ng.gain.setValueAtTime(nz*0.8*(cls==='snare'?0.8:0.3),now+0.008);
        }
        if(cls==='snare')fixedHp=120;
      }else if(cls==='clap'){
        D=0.05+dec*0.5; if(n<2)n=2;
        noise(0.9,src); lp=Math.min(lp,5000); fixedHp=600*Math.pow(2,p*1.5);
      }else if(cls==='hat'||cls==='cym'){
        const f=200*Math.pow(2,p*3);
        D=cls==='cym'?0.2+dec*2.5:(/OH$/.test(eg)?0.1+dec*1.0:0.02+dec*0.25);
        noise(0.5,src);
        [1,1.34,1.57,1.83,2.15,2.57].forEach(r=>osc('square',f*r,0.05*(0.3+metal*0.7)));
        fixedHp=cls==='cym'?3000:4500;
      }else if(cls==='shaker'){
        D=0.03+dec*0.4; n=2+Math.round(P(['GRNS','RTRG'],0.5)*5); sp=0.012+P(['GLEN'],0.4)*0.02;
        noise(0.8,src); fixedHp=3500;
      }else{
        D=eg==='GND-IM'?0.004:0.03+dec*0.8;
        noise(0.8,src);
      }
      const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=Math.max(fixedHp,40*Math.pow(2,hpfP*8));
      const lpf=c.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=Math.min(18000,lp);
      src.connect(hp); hp.connect(lpf); chain=lpf;
      amp.gain.setValueAtTime(0.0001,now);
      amp.gain.linearRampToValueAtTime(0.9,now+0.001);
      for(let i=0;i<n;i++){ const ti=now+i*sp; amp.gain.setValueAtTime(0.9,ti); amp.gain.exponentialRampToValueAtTime(0.12,ti+sp*0.8); }
      amp.gain.setValueAtTime(0.9,now+n*sp);
      amp.gain.exponentialRampToValueAtTime(0.0001,now+n*sp+D);
      end=now+n*sp+D+0.05;
    }else{
      const ml=MNM[eg].l;
      end=mnmVoice(c,this.noise,eg,function(n,d){const k=ml.indexOf(n);return k>=0?g(k):d;},si,now,stepDur,src,amp,stops);
    }
    let node=chain;
    if(dist>0.02){
      const sh=c.createWaveShaper(); const k=dist*60; const cv=new Float32Array(256);
      for(let i=0;i<256;i++){const x=i*2/255-1; cv[i]=(1+k)*x/(1+k*Math.abs(x))*0.7;}
      sh.curve=cv; node.connect(sh); node=sh;
    }
    node.connect(amp);
    const lv=c.createGain(); lv.gain.value=0.9*(st.vol/70); amp.connect(lv); lv.connect(this.out);
    stops.forEach(x=>{x.start(now);x.stop(end);});
  }
  tick(){
    const s=(this.cur+1)%16; this.cur=s;
    this.setState({step:s});
    const self=this;
    ['md','mnm'].forEach(function(e){
      const n=e==='md'?16:6;
      for(let t=0;t<n;t++){ if(self.pat(e,t)[s])self.voice(e,t,s); }
    });
    const sw=this.state.swing/99*0.33;
    const base=60/this.state.bpm/4*1000;
    this.timer=setTimeout(()=>this.tick(),base*(s%2===0?1+sw:1-sw));
  }
  togglePlay(){
    if(this.state.playing){
      clearTimeout(this.timer); this.timer=null; this.cur=-1;
      this.setState({playing:false,step:-1});
    }else{
      this.ensureAudio();
      this.setState({playing:true});
      this.tick();
    }
  }
  renderVals(){
    const st=this.state, e=st.engine, t=st.tr[e];
    const n=e==='md'?16:6;
    const eg=this.engOf(e,t);
    const pn=this.paramsNow();
    const pctOf=(p)=>(p.dead?0:(p.v-p.min)/(p.max-p.min));
    const cells=[];
    pn.forEach((p,i)=>{
      const fl=st.flash===i;
      const bgL=fl?SHADES[7]:SHADES[i*2], bgV=fl?SHADES[7]:SHADES[i*2+1];
      const fgL=fl?'#000':(i*2<=3?'#f2f2f2':'#0a0a0a'), fgV=fl?'#000':(i*2+1<=3?'#f2f2f2':'#0a0a0a');
      const op=p.dead?0.35:1;
      cells.push({text:p.label,bg:bgL,fg:fgL,op:op,pad:'3px 4px 0',fs:'10px',lh:'12px'});
      cells.push({text:p.dead?'--':((e==='mnm'&&!st.tempo)?mdisp(p.label,p.v,eg):disp(p.v,st.tempo)),bg:bgV,fg:fgV,op:op,pad:'3px 4px 0',fs:'19px',lh:'22px'});
    });

    const aph=st.aph||0, mxv=info(e,eg).max;
    const vw=buildView(e,eg,(k)=>this.val(e,t,eg,k)/mxv,aph>0?1-aph:0,aph,st);

    const dials=pn.map((p,i)=>({
      aria:(p.dead?'Unused encoder':p.label+' '+p.v+'. Turn to change. Click for next engine. Shift and click to switch machine.'),
      cap:st.flash===i?'#f4f4ec':'#222220',
      rot:'rotate('+(-135+pctOf(p)*270).toFixed(1)+' 32 32)',
      down:(ev)=>this.dDown(i,ev),move:(ev)=>this.dMove(i,ev),up:(ev)=>this.dUp(i,ev),
      wheel:(ev)=>this.dWheel(i,ev),key:(ev)=>this.dKey(i,ev),click:()=>this.dClick(i)
    }));


    const pat=this.pat(e,t);
    const pips=pat.map((on,i)=>({bg:st.step===i?'#ffffff':(on?'#8c8c90':'#2a2a2c')}));

    const fdef=[
      {id:'shift',label:'shift',on:st.shift,press:()=>this.setState({shift:!this.state.shift})},
      {id:'tempo',label:'tempo',on:st.tempo,press:()=>this.setState({tempo:!this.state.tempo})},
      {id:'play',label:st.playing?'stop':'play',on:st.playing,press:()=>this.togglePlay()}
    ];
    const fkeys=fdef.map(x=>({label:x.label,aria:x.id,cls:'key'+(x.on?' lit':''),pressed:x.on?'true':'false',press:x.press}));
    const skeys=[];
    for(let i=0;i<16;i++){
      if(st.shift){
        const ok=i<n;
        skeys.push({label:ok?(e==='md'?MD_TRK[i]:String(i+1)):'',aria:'Select track '+(i+1),cls:'key'+(ok&&i===t?' act':''),pressed:ok&&i===t?'true':'false',off:!ok,
          press:()=>{ this.ensureAudio(); this.setState({tr:Object.assign({},this.state.tr,{[e]:i})}); setTimeout(()=>{ if(!this.state.playing)this.voice(e,i,0); },0); }});
      }else{
        const on=pat[i];
        skeys.push({label:String(i+1),aria:'Step '+(i+1),cls:'key'+(on?' act':'')+(st.step===i?' now':''),pressed:on?'true':'false',off:false,
          press:()=>{ this.ensureAudio(); const nx=this.pat(e,t).slice(); nx[i]=!nx[i]; this.setState({pats:Object.assign({},this.state.pats,{[e+t]:nx})}); }});
      }
    }
    const trackName=e==='md'?MD_TRK[t]:'T'+(t+1);
    return {
      cells:cells,layers:vw.layers,labels:vw.labels,viewLabel:eg+' view',dials:dials,pips:pips,fkeys:fkeys,skeys:skeys,
      engName:eg+' \u00b7 '+(e==='md'?FAMN[MACH[eg].fam]:MNMFAMN[MNM[eg].fam]),
      where:(e==='md'?'machinedrum ':'monomachine ')+trackName,
      setName:st.tempo?'tempo':(st.shift?'set B':'set A'),
      bpm:st.bpm
    };
  }
}
</script>
