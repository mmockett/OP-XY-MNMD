name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Per-key sends in 1% steps (SDK 1.15) are in staging since etcetc000/open-xy#518.
  OPEN_XY_REPO: etcetc000/open-xy
  OPEN_XY_REF: staging
jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: md
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPO }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # tools/make_engine.py nests quotes in f-strings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Generated machines are current
        run: |
          python md/tools/make_engine.py
          git -C md diff --exit-code -- machines
      - name: Voice checks
        run: python md/tools/test_voices.py
      - name: Machine source, preview and sound checks
        run: |
          for machine in md/machines/*/; do
            python open-xy/sdk.py test --machine "$machine" --cxx clang++ --host-cxx g++ || exit 1
          done

  # The screens drawn in the stock look (docs/SCREEN.md): every control through
  # every value against the device's outline rules, churn and motion, and the
  # frames drawn as SVG (tools/frame_svg.py), kept as the run's artifact.
  screens:
    runs-on: ubuntu-latest
    env:
      STOCK_LOOK: mmsaw mmpulse mmsid mmstat mmpar mmdyn mmsin mmnois
    steps:
      - uses: actions/checkout@v4
        with:
          path: md
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPO }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synth screens, every control through every value
        run: python md/tools/check_synth_frames.py --sdk open-xy --out local $STOCK_LOOK
      - name: MD KIT's sections, every control through every value
        run: |
          mkdir -p local
          c++ -std=c++11 -O2 -fwrapv -w -Iopen-xy/sdk/include -Imd/machines/mdkit -DENGINE=mdkit md/tools/check_kit_frames.cpp -o local/check-kit
          local/check-kit
      # The DPRO engines and MD E12 need the owner's ROM captures, which CI hasn't.
      - name: The synths under the amp envelope, against the recorded frames
        run: python md/tools/check_envelope.py --sdk open-xy --out local $STOCK_LOOK mmens mmvo6
      - name: Frames as SVG
        if: always()
        run: python md/tools/frame_svg.py --sdk open-xy --out frames $STOCK_LOOK mdkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: frames/*/*.svg

  # The public Open-XY builder ships catalog machines built against etcetc000's
  # SDK, not the fork. These are the engines it can take as they are: synths
  # that need no drum kind, absent slot or ROM capture (docs/CATALOG.md).
  upstream:
    runs-on: ubuntu-latest
    env:
      CATALOG_READY: mmdyn mmens mmpar mmpulse mmsid mmstat mmvo6 mmsaw mmsin mmnois
    steps:
      - uses: actions/checkout@v4
        with:
          path: md
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: staging
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Catalog-ready engines against the upstream SDK
        run: |
          for engine in $CATALOG_READY; do
            python open-xy/sdk.py test --machine "md/machines/$engine" --cxx clang++ --host-cxx g++ || exit 1
          done
