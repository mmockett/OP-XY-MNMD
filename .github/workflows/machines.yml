name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  OPEN_XY_REPO: mmockett/open-xy
  OPEN_XY_REF: mnmd/drum-sdk
jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: md
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPO }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # tools/make_engine.py nests quotes in f-strings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Generated machines are current
        run: |
          python md/tools/make_engine.py
          git -C md diff --exit-code -- machines
      - name: Voice checks
        run: python md/tools/test_voices.py
      - name: Machine source, preview and sound checks
        run: |
          for machine in md/machines/*/; do
            python open-xy/sdk.py test --machine "$machine" --cxx clang++ --host-cxx g++ || exit 1
          done

  # The public Open-XY builder ships catalog machines built against etcetc000's
  # SDK, not the fork. These are the engines it can take as they are: synths
  # that need no drum kind, absent slot or ROM capture (docs/CATALOG.md).
  upstream:
    runs-on: ubuntu-latest
    env:
      CATALOG_READY: mmdyn mmens mmpar mmpulse mmsid mmstat mmvo6
    steps:
      - uses: actions/checkout@v4
        with:
          path: md
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: staging
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Catalog-ready engines against the upstream SDK
        run: |
          for engine in $CATALOG_READY; do
            python open-xy/sdk.py test --machine "md/machines/$engine" --cxx clang++ --host-cxx g++ || exit 1
          done
